<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Hub Ventures Incorporated (HHVI) - Gateway</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        @keyframes jumpSlide {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-20px) scale(0.98); opacity: 0.5; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-jump { animation: jumpSlide 0.5s ease-in-out; }
        .page-break, .html2pdf-page-break { page-break-after: always; break-after: page; }
        .search-results-dropdown { 
            z-index: 99999 !important; 
            position: absolute !important;
            top: 100% !important;
            left: 0 !important;
            right: 0 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body id="appBody" class="bg-black/85 text-zinc-100 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200" style="background-image: url('bg.jpg');">

    <!-- AUTHENTICATION DIALOG (SHOWN BY DEFAULT) -->
    <div id="loginModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 sm:p-8 max-w-md w-full space-y-5 text-center shadow-2xl">
            <div class="flex flex-col items-center space-y-3">
                <div class="w-24 h-24 bg-emerald-500/10 border border-emerald-500/40 rounded-2xl flex items-center justify-center p-2.5">
                    <img src="logo.jpg" alt="HHVI Logo" class="w-full h-full object-contain" onerror="this.style.display='none'">
                </div>
                <h2 class="text-lg font-black tracking-widest text-white uppercase">HERO HUB VENTURES INC.</h2>
                <span class="text-[10px] font-mono tracking-widest text-emerald-400 bg-emerald-950/80 border border-emerald-700/60 px-3 py-1 rounded-full uppercase font-bold">
                    SYSTEM GATEWAY
                </span>
            </div>

            <form id="loginForm" class="space-y-4 text-left pt-2">
                <div>
                    <label for="loginUsername" class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider block mb-1">Username</label>
                    <input type="text" id="loginUsername" required autocomplete="username" class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label for="loginPassword" class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider block mb-1">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                </div>
                
                <button type="submit" class="w-full py-2.5 bg-white text-black font-black text-xs rounded-lg hover:bg-zinc-200 transition-colors uppercase tracking-widest">
                    LOG IN
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN WRAPPER (HIDDEN UNTIL AUTHENTICATED) -->
    <div id="appContent" class="hidden flex-col min-h-screen justify-between">
        
        <!-- HEADER -->
        <header class="bg-black border-b border-zinc-800 px-4 py-2 text-xs font-mono">
            <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-4">
                    <span class="text-emerald-400 font-bold flex items-center gap-1.5 text-xs">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                        GATEWAY ACTIVE
                    </span>
                    
                    <div id="adminDiscreetPanel" class="hidden flex items-center gap-2 border-l border-zinc-800 pl-4 text-xs">
                        <span class="text-zinc-500">SESSION LOG:</span>
                        <span class="bg-zinc-900 border border-zinc-700 px-2 py-0.5 rounded text-emerald-400">
                            IP: <strong id="hdrIp" class="text-white">Fetching...</strong>
                        </span>
                        <span class="bg-zinc-900 border border-zinc-700 px-2 py-0.5 rounded text-sky-400">
                            DEVICE: <strong id="hdrPc" class="text-white">Fetching...</strong>
                        </span>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div id="userHeader" class="text-zinc-300 font-bold text-xs"></div>
                    <button id="settingsBtn" onclick="toggleUserModal(true)" class="hidden px-3 py-1 bg-zinc-800 text-xs font-bold rounded border border-zinc-700 hover:bg-zinc-700 text-white flex items-center gap-1.5">
                        <i class="fa-solid fa-gear text-amber-400"></i> Settings
                    </button>
                </div>
            </div>
        </header>

        <!-- NAVIGATION -->
        <nav class="bg-zinc-900/90 border-b border-zinc-800 px-4 py-3">
            <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-3">
                <h1 class="text-base font-black tracking-wider uppercase text-white flex items-center gap-2.5">
                    <img src="logo.jpg" alt="HHVI Logo" class="w-8 h-8 object-contain rounded" onerror="this.style.display='none'">
                    HERO HUB OPERATIONAL HUB
                </h1>
                <div class="flex flex-wrap gap-1.5 bg-black/60 p-1.5 rounded-lg border border-zinc-800 text-xs font-bold">
                    <button type="button" onclick="switchTab(1)" id="tab-1" class="px-3 py-1.5 rounded bg-white text-black transition-colors">Create Order</button>
                    <button type="button" onclick="switchTab(2)" id="tab-2" class="px-3 py-1.5 rounded text-zinc-400 hover:text-white transition-colors">DR Generator</button>
                    <button type="button" onclick="switchTab(3)" id="tab-3" class="px-3 py-1.5 rounded text-zinc-400 hover:text-white transition-colors">Proof Attachments</button>
                    <button type="button" onclick="switchTab(4)" id="tab-4" class="px-3 py-1.5 rounded text-zinc-400 hover:text-white transition-colors">Approval Form</button>
                    <button type="button" onclick="switchTab(5)" id="tab-5" class="px-3 py-1.5 rounded text-zinc-400 hover:text-white transition-colors">Approval Status & Ledger</button>
                </div>
            </div>
        </nav>

        <!-- MAIN VIEWS -->
        <main class="max-w-7xl mx-auto p-4 w-full flex-1">
            <section id="layer-1" class="space-y-6">
                <div class="bg-zinc-900/90 p-6 rounded-2xl border border-zinc-800 space-y-6 shadow-2xl">
                    <div class="border-b border-zinc-800 pb-3 flex justify-between items-center">
                        <h2 class="text-xl font-black text-white tracking-wide">ORDER CREATION</h2>
                        <span class="text-xs text-zinc-400 font-mono">v2026.2</span>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                        <div>
                            <label for="l1Prefix" class="block font-bold text-zinc-300 mb-1.5">Prefix</label>
                            <select id="l1Prefix" onchange="toggleCustomPrefix(); updateRefNo();" class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                                <option value="HHVI-CO">HHVI-CO (Consignment)</option>
                                <option value="HHVI-OO">HHVI-OO (Online Order)</option>
                                <option value="HHVI-WS">HHVI-WS (Wholesale)</option>
                                <option value="HHVI-PO">HHVI-PO (Pre-Orders)</option>
                                <option value="OTHER">Others</option>
                            </select>
                            <input type="text" id="l1CustomPrefix" oninput="updateRefNo()" placeholder="Custom Prefix" class="w-full bg-black border border-amber-500 rounded-lg p-2.5 text-xs text-white mt-2 hidden focus:outline-none">
                        </div>
                        <div>
                            <label for="l1RefNo" class="block font-bold text-zinc-300 mb-1.5">Ref Number</label>
                            <input type="text" id="l1RefNo" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-2.5 text-xs font-mono text-emerald-400 font-bold focus:outline-none" readonly>
                        </div>
                        <div>
                            <label for="l1Customer" class="block font-bold text-zinc-300 mb-1.5">Customer Name</label>
                            <input type="text" id="l1Customer" placeholder="Enter Customer Name" class="w-full bg-black border border-zinc-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="border-t border-zinc-800 pt-4 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-zinc-300 uppercase tracking-wider">Line Items</h3>
                            <button type="button" onclick="addLineItem()" class="px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-lg hover:bg-emerald-500 transition-colors">
                                <i class="fa-solid fa-plus"></i> Add Item
                            </button>
                        </div>

                        <div class="rounded-lg border border-zinc-800 bg-black/40">
                            <table class="w-full text-xs text-left">
                                <thead class="bg-black text-zinc-400 font-mono">
                                    <tr>
                                        <th class="p-2.5 border-b border-zinc-800">Description</th>
                                        <th class="p-2.5 border-b border-zinc-800 w-24">Qty</th>
                                        <th class="p-2.5 border-b border-zinc-800 w-28">Amount</th>
                                        <th class="p-2.5 border-b border-zinc-800 w-32">Total</th>
                                        <th class="p-2.5 border-b border-zinc-800 w-16 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="lineItemsTable" class="divide-y divide-zinc-800/60"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button type="button" onclick="saveOrder()" class="px-6 py-2.5 bg-white text-black font-black text-xs rounded-lg hover:bg-zinc-200 transition-colors uppercase tracking-wider">
                            Submit Order
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Supabase Endpoint Setup
        const SUPABASE_URL = 'https://lfqwghdrirqcbzkufdrq.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const DEFAULT_USERS = [
            { id: 1, username: 'admin', hash: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918', role: 'Admin' }
        ];

        let currentUser = null;
        let users = JSON.parse(localStorage.getItem('hhvi_users')) || DEFAULT_USERS;
        let orders = JSON.parse(localStorage.getItem('hhvi_orders')) || [];

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const uInput = document.getElementById('loginUsername').value.trim();
            const pInput = document.getElementById('loginPassword').value.trim();

            const inputHash = await hashPassword(pInput);
            const foundUser = users.find(u => u.username.toLowerCase() === uInput.toLowerCase() && u.hash === inputHash);

            if (foundUser) {
                currentUser = { username: foundUser.username, role: foundUser.role };
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('appContent').classList.remove('hidden');
                document.getElementById('appContent').classList.add('flex');
            } else {
                alert('Access Denied: Invalid credentials.');
            }
        });

        function addLineItem() {
            const tbody = document.getElementById('lineItemsTable');
            if (!tbody) return;
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="p-2"><input type="text" class="w-full bg-black border border-zinc-800 rounded p-1.5 text-xs text-white"></td>
                <td class="p-2"><input type="number" value="1" min="1" class="w-full bg-black border border-zinc-800 rounded p-1.5 text-center text-white"></td>
                <td class="p-2"><input type="number" value="0.00" step="0.01" class="w-full bg-black border border-zinc-800 rounded p-1.5 text-right text-white"></td>
                <td class="p-2 font-mono text-right font-bold text-emerald-400">₱0.00</td>
                <td class="p-2 text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></td>
            `;
            tbody.appendChild(row);
        }

        function switchTab(tabNum) {
            console.log('Switched to tab', tabNum);
        }

        function toggleCustomPrefix() {}
        function updateRefNo() {}
        function saveOrder() { alert('Order saved'); }
    </script>
</body>
</html>
